<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ismail & Yara</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
        }

        body {
            background-image: url("background.webp") !important; 
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            min-height: 100dvh !important;
        }

        /* --- THE POPUP WINDOW (OVERLAY) --- */
        #nameOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85); /* Dark elegant blue transparent */
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .name-box {
            background: #fdfaf3;
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #c5a059;
        }

       .name-box h2 {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    color: #000000; /* Changed from #1e293b */
    margin-bottom: 20px;
    letter-spacing: 2px;
}

        .name-box input {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: 1px solid #cbd5e1;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            outline: none;
        }

        .submit-name-btn {
    background: #C2B294; /* Changed from #1e293b */
    color: white;
    padding: 12px 40px;
    border-radius: 50px;
    border: none;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    width: 100%;
}
        /* --- ENVELOPE STYLING --- */
        .envelope-wrapper {
            position: relative;
            z-index: 10;
            transform: scale(0.85);
        }

        @media screen and (max-width: 768px) {
            body {
                background-image: url("mobile-background.webp") !important;
                background-position: center top !important;
            }

            .envelope-wrapper {
                width: 360px !important;
                height: 200px !important;
                transform: scale(0.65) translateY(60px) !important;
                display: block !important;
            }

            .envelope {
                position: absolute !important;
                width: 360px !important;
                height: 200px !important;
            }

            .name { font-size: 38px !important; letter-spacing: 2px !important; margin-bottom: 5px !important; }
            .and-text { font-size: 50px !important; margin: 10px 0 !important; }
            .wedding-date { font-size: 20px !important; margin-top: 10px !important; }
            .invite-text { font-size: 19px !important; margin-bottom: 25px !important; }

            .open-btn {
                padding: 15px 0 !important;
                font-size: 18px !important;
                width: 90% !important;
                border-radius: 50px !important;
                text-decoration: none;
                display: block;
                margin: 0 auto;
                background: #C2B294;
                color: white;
                font-weight: 700;
            }

            .invitation-card {
                position: absolute !important;
                width: 340px !important;
                height: 480px !important; 
                padding: 40px 20px !important;
                left: 10px !important;
                bottom: 10px !important;
                transform: scale(1) !important;
            }

            .envelope-wrapper.open .invitation-card {
                transform: translateY(-380px) !important; 
                z-index: 10 !important;
            }
            
            .wax-seal { top: 85px !important; left: 50% !important; transform: translateX(-50%) !important; }
        }
    </style>
</head>
<body>

    <!-- 1. THE NAME POPUP WINDOW -->
    <div id="nameOverlay">
        <div class="name-box">
            <h2>Welcome Guest</h2>
            <p style="font-size: 13px;color: #000000;; margin-bottom: 15px;">Please enter your name to view the invitation</p>
            <input type="text" id="guestNameInput" placeholder="Enter Your Name">
            <button class="submit-name-btn" onclick="submitName()">CONTINUE</button>
        </div>
    </div>

    <!-- 2. THE ENVELOPE -->
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="invitation-card">
            <div class="avatar-circle">
                <svg viewBox="0 0 32 32" width="35" height="35" fill="white">
                    <path d="M16 28.5L13.8 26.5C5.8 19.3 0.5 14.5 0.5 8.5C0.5 3.8 4.2 0.1 8.9 0.1C11.5 0.1 14.1 1.3 15.8 3.3C17.5 1.3 20.1 0.1 22.7 0.1C27.4 0.1 31.1 3.8 31.1 8.5C31.1 14.5 25.8 19.3 17.8 26.5L16 28.5Z"/>
                </svg>
            </div>
            <h1 class="name">ISMAIL</h1>
            <span class="and-text">&</span>
            <h1 class="name">YARA</h1>
            <div class="elegant-line"></div>
            <p class="wedding-date">September 04, 2026</p>
            <p class="invite-text">cordially invite.</p>
            
            <a href="#" onclick="trackOpenClick(event)" class="open-btn">Open</a>
        </div>

        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal" id="waxSeal">
                <span style="font-size: 25px; color: white;">♥</span>
            </div>
        </div>
    </div>

    <script>
        // Check if name already exists in memory
        window.onload = function() {
            const savedName = localStorage.getItem('wedding_guest_name');
            if (savedName) {
                document.getElementById('nameOverlay').style.display = 'none';
            }
        };

        // Logic for the popup
        function submitName() {
            const nameInput = document.getElementById('guestNameInput').value;
            if (nameInput.trim() === "") {
                alert("Please enter your name first ♥");
                return;
            }
            
            // Save name for the next page
            localStorage.setItem('wedding_guest_name', nameInput);
            
            // Hide the popup with animation
            const overlay = document.getElementById('nameOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        }

        // Envelope logic
        const waxSeal = document.getElementById('waxSeal');
        const envelopeWrapper = document.getElementById('envelopeWrapper');
        
        waxSeal.addEventListener('click', (e) => {
            e.stopPropagation();
            envelopeWrapper.classList.add('open');
        });
    </script>

    <!-- 3. FIREBASE AND TRACKING SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCB5tx5ffwZENpTqU9otGTvxjmlgqyjwQ",
            authDomain: "ismail-yara-wedding.firebaseapp.com",
            projectId: "ismail-yara-wedding",
            storageBucket: "ismail-yara-wedding.firebasestorage.app",
            messagingSenderId: "192107873346",
            appId: "1:192107873346:web:db146674f6632ffb3759db"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function trackOpenClick(e) {
            e.preventDefault(); // Stop immediate navigation

            // 1. Generate or retrieve the unique user ID
            let myUserId = localStorage.getItem('wedding_user_id');
            if (!myUserId) {
                myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('wedding_user_id', myUserId);
            }

            // 2. Grab the name they entered in the popup
            const guestName = localStorage.getItem('wedding_guest_name') || "Unknown Guest";
            const btn = e.target;
            btn.innerText = "Opening..."; 

            // 3. Save to a new "envelope_opens" collection
            // Using myUserId as the document ID ensures no duplicates
            db.collection("envelope_opens").doc(myUserId).set({
                name: guestName,
                lastOpened: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                // 4. Navigate to the next page upon success
                window.location.href = "details.html?play=true";
            }).catch((error) => {
                console.error("Tracking error: ", error);
                // Fallback: still navigate if Firebase fails
                window.location.href = "details.html?play=true";
            });
        }
    </script>
</body>
</html>
